name: Facebook daily queue (dry-run by default)

on:
  schedule:
    - cron: '0 3 * * *'  # 10:00 Asia/Ho_Chi_Minh
    - cron: '0 9 * * *'  # 16:00 verification/report
  workflow_dispatch:
    inputs:
      command:
        description: 'prepare = full AI dry-run/queue; preflight = read-only token check; report = verify existing posts'
        type: choice
        options: [prepare, preflight, report]
        default: prepare

permissions:
  contents: read

concurrency:
  group: nguyen-ha-facebook
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_facebook*.py' -v

  prepare:
    needs: validate
    if: github.event.schedule == '0 3 * * *' || inputs.command == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current dated source feed
        run: python3 scripts/latest_articles.py
      - name: Run pinned local AI (no cloud credentials)
        run: |
          docker run -d --name social-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_NO_CLOUD=1 ollama/ollama:0.34.2
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          docker exec social-ollama ollama pull qwen3:4b-instruct-2507-q4_K_M
      - name: Read deployed articles, prepare 10 drafts, checkpoint queue
        run: python3 scripts/facebook_pipeline.py prepare --remote-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facebook-drafts-${{ github.run_id }}
          path: out/facebook/
          retention-days: 7
          if-no-files-found: ignore

  schedule-on-meta:
    needs: prepare
    # All three gates are required; config/facebook.json live_enabled remains false.
    if: vars.FACEBOOK_LIVE_ENABLED == 'true' && vars.FACEBOOK_TESTS_PASSED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      FACEBOOK_LIVE_ENABLED: ${{ vars.FACEBOOK_LIVE_ENABLED }}
      FACEBOOK_TESTS_PASSED: ${{ vars.FACEBOOK_TESTS_PASSED }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/facebook_pipeline.py schedule --remote-state

  verify-or-preflight:
    needs: validate
    if: github.event.schedule == '0 9 * * *' || inputs.command == 'report' || inputs.command == 'preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      COMMAND: ${{ inputs.command == 'preflight' && 'preflight' || 'report' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/facebook_pipeline.py "$COMMAND" --remote-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facebook-report-${{ github.run_id }}
          path: out/facebook/
          retention-days: 7
          if-no-files-found: ignore
