<footer class="footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-contact">
        <a class="brand" href="/">
          <span class="mark"><img src="/assets/nguyen-ha-logo.svg" alt="{site_name}" width="64" height="64" decoding="async"></span>
          <span>{site_name}<small>{brand_sub}</small></span>
        </a>
        {contact_box}
      </div>
      <div class="footer-navigation">
        <nav class="footer-utility" aria-label="Footer trang chính">{utility_links}</nav>
        <nav class="footer-nav" aria-label="Footer chuyên mục">{footer_columns_html}</nav>
        <nav class="footer-support" aria-label="Footer hỗ trợ và chính sách">{support_links}</nav>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2026 {site_name}</p>
    </div>
  </div>
</footer>
