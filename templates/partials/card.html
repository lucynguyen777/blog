<article class="card">
  <a href="{card_url}">
    <div class="card-art {card_tone}">
      <span class="card-art-title">{card_title}</span>
      <span class="art-label">{card_hub_label}</span>
    </div>
    <div class="card-content">
      <span class="meta">CẨM NANG · NGUYỄN HÀ</span>
      <h3>{card_title}</h3>
      <p>{card_excerpt}</p>
    </div>
  </a>
</article>
