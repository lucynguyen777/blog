<div class="conditional-cta {cta_tone}" style="background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:18px;padding:22px;margin:28px 0">
  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
    <div>
      <span class="eyebrow" style="margin-bottom:6px">{cta_eyebrow}</span>
      <h3 style="font-size:20px;margin:0 0 6px">{cta_title}</h3>
      <p style="margin:0;font-size:14px">{cta_desc}</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-shrink:0">
      <a class="pill gold" href="{cta_primary_link}">{cta_primary_text}</a>
      <a class="text-link" href="{cta_secondary_link}">{cta_secondary_text}</a>
    </div>
  </div>
</div>
